name: Sync upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'teikengstudio/StarRailCopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge LmeSzinc master without replacing fork changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/LmeSzinc/StarRailCopilot.git
          git fetch --no-tags upstream master:refs/remotes/upstream/master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Already up to date with LmeSzinc/master.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit upstream/master; then
            echo '::error::Upstream merge conflicts; master was not changed.'
            {
              echo '## Upstream merge needs manual resolution'
              echo 'No changes were pushed. Fork-specific cloud features are preserved.'
              echo '```text'
              git diff --name-only --diff-filter=U
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          git push origin HEAD:master
          echo 'Merged LmeSzinc/master into master without force-pushing.' >> "$GITHUB_STEP_SUMMARY"
